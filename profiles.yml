# Kept in the repo rather than ~/.dbt so a clone can build Gold without setup. It holds no
# secrets: the warehouse is a local DuckDB file, and the path is relative to the project root.
pantryiq:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('PANTRYIQ_DB', 'data/pantryiq.duckdb') }}"
      # dbt-duckdb attaches the same file Python writes Silver into, so Gold builds against the
      # live Silver tables with no copy step. Nothing may run dbt and the Python pipeline at the
      # same time — DuckDB takes a single writer lock.
      schema: gold
      threads: 4
    # Write-audit-publish: the gate builds HERE, and `pantryiq.gold.publish` swaps into `gold`
    # only when every test passed. Gold therefore never holds a half-built vintage.
    staging:
      type: duckdb
      path: "{{ env_var('PANTRYIQ_DB', 'data/pantryiq.duckdb') }}"
      schema: gold_staging
      threads: 4
