name: pantryiq
version: "1.0.0"
config-version: 2

profile: pantryiq

model-paths: ["models"]
test-paths: ["dbt_tests"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Gold is on the serving hot path (the Phase-4 agent queries it per request), so every model is
# a real table rather than a view — the join work is done once at build time, not per query.
# Silver stays Python-managed: parsing and fallback logic belong in tested code, not in SQL.
# No `+schema:` here — dbt CONCATENATES it onto the profile's schema, so setting both produced
# `gold_gold`. The profile already targets `gold`.
models:
  pantryiq:
    gold:
      +materialized: table

# The cost table is hand-curated reference data that changes only by human decision — the
# textbook case for a seed. Types are declared because `note` contains commas, and an
# auto-detected delimiter once read the whole header as a single column.
seeds:
  pantryiq:
    cost_reference:
      +schema: silver
      +column_types:
        fdc_id: VARCHAR
        usd_per_kg: DOUBLE
        description: VARCHAR
        note: VARCHAR
